# La imagen la construye el CI de GitHub (github.com/ikerlorente11/ci) y se despliega con
# docker compose pull && docker compose up -d. `build` queda para probarla en local.
# Para desarrollar, `npm run dev` en local.
services:
  portfolio:
    image: ghcr.io/ikerlorente11/iker-portfolio:latest
    build: .
    container_name: iker_portfolio_prod
    restart: unless-stopped
    ports:
      - "8021:80"
