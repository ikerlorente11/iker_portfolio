services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: iker_portfolio
    restart: unless-stopped
    ports:
      - "8084:4321"
    volumes:
      - ./src:/app/src
      - ./public:/app/public

  portfolio-prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iker_portfolio_prod
    restart: unless-stopped
    ports:
      - "8085:80"
    develop:
      watch:
        - path: ./src
          action: rebuild
        - path: ./public
          action: rebuild
        - path: ./nginx.conf
          action: rebuild
        - path: ./astro.config.mjs
          action: rebuild
        - path: ./package.json
          action: rebuild
