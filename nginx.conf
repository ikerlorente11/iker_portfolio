# ── Idioma para la redirección de la raíz ─────────────────────────
# 1) Cookie "lang" (la fija el selector de idioma del Nav)
# 2) Accept-Language del navegador
# 3) Sin cabecera (bots, curl) → es (locale por defecto)
map $http_accept_language $lang_accept {
    default        en;
    ""             es;
    ~^eu           eu;
    ~^es           es;
    ~^en           en;
    ~(^|,)\s*es\b  es;
}

map $cookie_lang $lang {
    es       es;
    en       en;
    eu       eu;
    default  $lang_accept;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # La raíz redirige en servidor (302) al idioma detectado. Antes era una
    # página vacía con redirección JS: Google la veía sin contenido (soft 404)
    # y era el destino del hreflang x-default, lo que rompía todo el cluster.
    location = / {
        add_header Cache-Control "private, no-store";
        add_header Vary "Accept-Language, Cookie";
        return 302 /$lang/;
    }

    # Servir archivos estáticos; fallback a index.html del mismo directorio
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Caché agresiva solo para assets con hash en el nombre (generados por Astro)
    location ~* ^/_astro/.*\.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico|mp3|mp4|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Assets estáticos SIN hash en el nombre (imágenes de /images/, favicon…).
    # Como el nombre del fichero no cambia al actualizar el contenido, NO se
    # pueden cachear de forma inmutable: hay que revalidar siempre. Con ETag/
    # Last-Modified el navegador recibe 304 si no cambió (casi sin coste) y la
    # nueva versión en cuanto cambia. Evita seguir viendo imágenes viejas.
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico|mp3|mp4|json)$ {
        add_header Cache-Control "no-cache";
        access_log off;
    }

    # Sin caché para HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;
}
