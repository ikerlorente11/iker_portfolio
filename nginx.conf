server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Servir archivos estáticos; fallback a index.html del mismo directorio
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Caché agresiva solo para assets con hash en el nombre (generados por Astro)
    location ~* ^/_astro/.*\.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico|mp3|mp4|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Caché corta para assets estáticos sin hash (favicon, etc.)
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico|mp3|mp4|json)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # Sin caché para HTML
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
